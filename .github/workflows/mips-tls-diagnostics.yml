name: MIPS TLS diagnostics
on:
  push:
    branches: [engineering/layer-isolation]
    paths: ['.github/workflows/mips-tls-diagnostics.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [no-inline, standard]
        harness: [http, https]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Prepare one matrix cell
        env:
          COMPILER: ${{ matrix.compiler }}
          HARNESS: ${{ matrix.harness }}
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          go version > evidence/toolchain.txt
          qemu-mips --version >> evidence/toolchain.txt
          if [[ "$COMPILER" == no-inline ]]; then
            sed -i 's/^flags=(-trimpath/flags=(-gcflags=all=-l -trimpath/' scripts/core.sh
            grep -q '^flags=(-gcflags=all=-l -trimpath' scripts/core.sh
          fi
          if [[ "$HARNESS" == http ]]; then
            git show 84289930e320d2d00ace21f6562619bb5e1776f3:scripts/loopback.mjs > scripts/loopback.mjs
            git show 84289930e320d2d00ace21f6562619bb5e1776f3:scripts/test-cert.go > scripts/test-cert.go
          fi
          sha256sum scripts/core.sh scripts/loopback.mjs scripts/test-cert.go > evidence/inputs.sha256
          grep '^flags=' scripts/core.sh > evidence/compiler-flags.txt
      - run: bash scripts/core.sh
      - name: Reproduce under QEMU
        run: |
          set -uo pipefail
          sha256sum dist/xray-lite > evidence/binary.sha256
          failed=0
          for attempt in 1 2 3; do
            VLESS_TEST_EMULATOR=qemu-mips node scripts/loopback.mjs ./dist/xray-lite 2>&1 | tee "evidence/attempt-$attempt.log"
            result=$?
            printf '%s %s\n' "$attempt" "$result" >> evidence/exit-codes.txt
            if (( result != 0 )); then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mips-${{ matrix.compiler }}-${{ matrix.harness }}
          path: evidence/
          if-no-files-found: error
