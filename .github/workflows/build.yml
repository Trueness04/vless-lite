name: Build VLESS Lite
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - run: bash scripts/core.sh
      - run: bash scripts/test-core.sh
      - run: bash scripts/test-service.sh
      - run: |
          VLESS_TEST_CHROME="$(command -v google-chrome)"
          export VLESS_TEST_CHROME
          node scripts/test-luci.mjs
      - run: sudo bash scripts/test-firewall.sh
      - run: node scripts/loopback.mjs
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: VLESS_TEST_EMULATOR=qemu-mips node scripts/loopback.mjs ./dist/xray-lite
      - uses: actions/upload-artifact@v4
        with:
          name: xray-lite
          path: dist/
          if-no-files-found: error
  openwrt:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mode: [sdk, firmware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xray-lite
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd squashfs-tools
      - run: JOBS=4 bash scripts/openwrt.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openwrt-${{ matrix.mode }}-hardware-untested
          path: artifacts/
          if-no-files-found: warn
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [core, openwrt]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*-hardware-untested
          path: release
      - name: Publish firmware and APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir assets
          find release -type f ! -name SHA256SUMS -exec cp {} assets/ \;
          (cd assets && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes 'Experimental. No hardware or recovery validation. Do not flash without explicit approval.'

